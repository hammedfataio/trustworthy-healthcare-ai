[project]
name = "trustworthy-healthcare-ai"
version = "0.1.0"
description = "Research experiments in trustworthy AI, uncertainty quantification, robustness, medical imaging, and multimodal machine learning for healthcare."
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "jupyter",
    "medmnist>=3.0.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
